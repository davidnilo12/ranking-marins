<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modo TV — Marins Benefícios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#071210; --surface:#0f1d1b; --surface-2:#152826; --line:rgba(255,255,255,.08);
    --ink:#eef4f2; --ink-2:#adbab5; --ink-3:#77837e;
    --accent:#3db3a2; --accent-strong:#5ecab9; --accent-soft:#123531;
    --gold:#e8c25a; --gold-bg:rgba(232,194,90,.16);
    --silver:#c3ccd3; --silver-bg:rgba(195,204,211,.13);
    --bronze:#e0955e; --bronze-bg:rgba(224,149,94,.15);
    --up:#3ecb82; --down:#ff6b6b;
  }
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;font-family:"IBM Plex Sans",system-ui,sans-serif;color:var(--ink)}
  .slide{position:fixed;inset:0;opacity:0;pointer-events:none;transition:opacity .7s ease;background:#000;overflow:hidden}
  .slide.active{opacity:1;pointer-events:auto}

  /* ---------- slide 1: ranking desenhado para TV (palco 1920x1080) ---------- */
  #slide-ranking{background:var(--bg)}
  #stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform:translate(-50%,-50%) scale(var(--s,.5));
    background:radial-gradient(ellipse 80% 60% at 85% -10%,rgba(61,179,162,.22),transparent 60%),
               radial-gradient(ellipse 70% 60% at 0% 110%,rgba(232,194,90,.10),transparent 60%),var(--bg);overflow:hidden}
  .head{position:absolute;left:56px;right:56px;top:40px;height:210px;display:flex;align-items:center;gap:44px}
  .banner{height:210px;width:auto;border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.5);flex:none;background:var(--surface)}
  .banner.missing{display:none}
  .title-col{flex:1;min-width:0}
  .eyebrow{font-weight:600;font-size:22px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
  .title{font-family:Sora,sans-serif;font-weight:800;font-size:76px;line-height:1.02;margin-top:8px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;align-items:center;gap:18px;margin-top:16px;font-size:26px;color:var(--ink-2)}
  .meta .range{font-family:Sora,sans-serif;font-weight:700;color:var(--ink)}
  .pill{display:inline-flex;align-items:center;gap:10px;padding:8px 18px;border-radius:99px;background:var(--accent-soft);color:var(--accent-strong);font-size:22px;font-weight:600;white-space:nowrap}
  .pill .dot{width:11px;height:11px;border-radius:50%;background:currentColor;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

  .boards{position:absolute;left:56px;right:56px;top:286px;bottom:56px;display:grid;grid-template-columns:1fr 480px;gap:28px}
  .board{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:24px 28px;display:flex;flex-direction:column;min-height:0;box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .board-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
  .board-head h2{font-family:Sora,sans-serif;font-weight:700;font-size:34px;margin:0}
  .board-head span{font-size:22px;color:var(--ink-3)}
  .grid{flex:1;min-height:0;display:grid;grid-auto-flow:column;column-gap:22px;row-gap:8px;align-content:start}
  .row{display:flex;align-items:center;gap:14px;padding:0 16px 0 10px;border-radius:14px;background:var(--surface-2);min-width:0;opacity:0;animation:rowIn .55s cubic-bezier(.2,.8,.3,1) forwards}
  @keyframes rowIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .rk{flex:none;display:flex;align-items:center;justify-content:center;border-radius:11px;font-family:Sora,sans-serif;font-weight:800;background:rgba(255,255,255,.06);color:var(--ink-2)}
  .arrow{flex:none;width:22px;text-align:center;font-weight:800}
  .arrow.up{color:var(--up)}.arrow.down{color:var(--down)}.arrow.same{color:var(--ink-3)}
  .nm{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row.r1{background:var(--gold-bg);box-shadow:inset 0 0 0 2px rgba(232,194,90,.55)}
  .row.r1 .rk{background:var(--gold);color:#2b1f02}.row.r1 .nm{color:#ffe7a3}
  .row.r2{background:var(--silver-bg)}.row.r2 .rk{background:var(--silver);color:#1b2126}
  .row.r3{background:var(--bronze-bg)}.row.r3 .rk{background:var(--bronze);color:#2a1505}
  .empty{color:var(--ink-3);font-size:28px;padding:40px 0;text-align:center}
  .foot{position:absolute;left:56px;right:110px;bottom:16px;display:flex;justify-content:space-between;font-size:19px;color:var(--ink-3)}
  #progress{position:absolute;left:0;bottom:0;height:6px;width:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transform-origin:left;transform:scaleX(0)}

  /* ---------- slide 2: ranking animado ---------- */
  #slide-animado iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#07080f}

  /* ---------- slide 3: vídeo ---------- */
  .slide-vid video{width:100%;height:100%;object-fit:contain;display:block;background:#000}

  #sound-toggle{position:fixed;bottom:18px;right:18px;z-index:9999;width:52px;height:52px;border-radius:50%;border:none;background:#0f6f66;color:#fff;font-size:20px;line-height:52px;text-align:center;padding:0;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer;opacity:.85}
</style>
</head>
<body>

<div id="slide-ranking" class="slide">
  <div id="stage">
    <div class="head">
      <img class="banner" id="banner" src="../banner-churrasco-do-patrao.webp" alt="Churrasco do Patrão — Marins Benefícios">
      <div class="title-col">
        <div class="eyebrow">Marins Benefícios · campanha</div>
        <div class="title" id="tvTitle">Ranking Churrasco do Patrão</div>
        <div class="meta">
          <span class="range" id="tvRange">—</span>
          <span class="pill"><span class="dot"></span><span id="tvUpdated">Atualizado —</span></span>
        </div>
      </div>
    </div>
    <div class="boards">
      <div class="board">
        <div class="board-head"><h2>Por corretor(a)</h2><span>quem vende mais, sobe</span></div>
        <div class="grid" id="gCor"></div>
      </div>
      <div class="board">
        <div class="board-head"><h2>Por supervisor(a)</h2></div>
        <div class="grid" id="gSup"></div>
      </div>
    </div>
    <div class="foot"><span>Atualiza às 13h e às 19h, de segunda a sexta · valores em suspense até o fim da campanha</span><span>▲ subiu · ▼ caiu · • manteve</span></div>
    <div id="progress"></div>
  </div>
</div>

<div id="slide-cruzeiro" class="slide slide-vid"><video id="tv-cruzeiro" src="cruzeiro-ranking.mp4" muted playsinline preload="metadata"></video></div>
<div id="slide-video" class="slide slide-vid"><video id="tv-video" src="video.mp4" muted playsinline preload="metadata"></video></div>
<div id="slide-vendeu" class="slide slide-vid"><video id="tv-vendeu" src="vendeu-ganhou.mp4" muted playsinline preload="metadata"></video></div>

<button id="sound-toggle" aria-label="Ativar ou desativar som">🔇</button>

<script>
(function(){
  // ======= CONFIGURAÇÃO =======
  // Ordem das telas no ciclo. Opções: 'ranking', 'cruzeiro', 'video' (VIDEO TV), 'vendeu' (Vendeu Ganhou)
  var SEQUENCIA = ['cruzeiro', 'ranking', 'video', 'vendeu'];
  var RANKING_SECONDS = 25;          // tempo do ranking na tela
  var ANIMADO_URL = 'cruzeiro.html'; // ranking animado (Cruzeiro dos Campeões)
  var ANIMADO_MAX_SECONDS = 120;     // segurança: se o animado não avisar que acabou
  var ERROR_SKIP_SECONDS = 2;        // vídeo com erro: pula para a próxima tela
  var RANKING_URL = '../';           // página do ranking (de onde vêm os dados)
  // ============================

  var $ = function(id){ return document.getElementById(id); };
  var slides = { ranking: $('slide-ranking'), animado: $('slide-animado'), cruzeiro: $('slide-cruzeiro'), video: $('slide-video'), vendeu: $('slide-vendeu') };
  var videos = { cruzeiro: $('tv-cruzeiro'), video: $('tv-video'), vendeu: $('tv-vendeu') };
  var frame = $('anim-frame'), soundBtn = $('sound-toggle');
  var stage = $('stage');
  var idx = -1, timer = null, progT0 = 0, progDur = 0, soundOn = false;

  function fit(){ stage.style.setProperty('--s', Math.min(innerWidth/1920, innerHeight/1080)); }
  addEventListener('resize', fit); fit();
  $('banner').addEventListener('error', function(){ this.classList.add('missing'); });

  // ---------- dados do ranking ----------
  var lastData = null;
  function loadData(){
    return fetch(RANKING_URL + '?tv=' + Date.now(), { cache: 'no-store' })
      .then(function(r){ return r.text(); })
      .then(function(html){
        var m = html.match(/window\.__RANKING_DATA__\s*=\s*(\{[\s\S]*?\})\s*;\s*<\/script>/);
        if (m) lastData = JSON.parse(m[1]);
        var t = html.match(/<title>([^<]*)<\/title>/);
        if (t) $('tvTitle').textContent = t[1].replace(/\s+na Lancha$/i, '').trim();
      })
      .catch(function(){ /* sem rede: mantém os últimos dados */ });
  }
  function fmtDate(iso){
    if (!iso) return '—';
    var p = iso.slice(0,10).split('-');
    return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : iso;
  }
  function fmtUpdated(iso){
    var d = new Date(iso);
    if (isNaN(d)) return '—';
    return d.toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' }).replace(',', ' às');
  }
  function esc(s){ return String(s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function arrow(r, rank){
    var p = typeof r.prevRank === 'number' ? r.prevRank : null;
    if (p === null || p > rank) return '<span class="arrow up">▲</span>';
    if (p === rank) return '<span class="arrow same">•</span>';
    return '<span class="arrow down">▼</span>';
  }
  function renderBoard(el, rows, opts){
    if (!rows || !rows.length){ el.innerHTML = '<div class="empty">Nenhuma venda registrada ainda.</div>'; return; }
    var cols = opts.cols(rows.length);
    var perCol = Math.ceil(rows.length / cols);
    var avail = el.clientHeight || opts.fallbackH;
    var h = Math.max(36, Math.min(opts.maxH, Math.floor((avail - (perCol-1)*8) / perCol)));
    el.style.gridTemplateRows = 'repeat(' + perCol + ',' + h + 'px)';
    el.style.gridTemplateColumns = 'repeat(' + cols + ',minmax(0,1fr))';
    var fs = Math.round(h * 0.44), rk = Math.round(h * 0.72);
    el.innerHTML = rows.map(function(r, i){
      var rank = i + 1, cls = rank <= 3 ? ' r' + rank : '';
      return '<div class="row' + cls + '" style="animation-delay:' + (i*35) + 'ms">' +
        '<span class="rk" style="width:' + rk + 'px;height:' + rk + 'px;font-size:' + Math.round(fs*.95) + 'px">' + rank + '</span>' +
        '<span style="font-size:' + Math.round(fs*.8) + 'px" class="arrow-wrap">' + arrow(r, rank) + '</span>' +
        '<span class="nm" style="font-size:' + fs + 'px">' + esc(r.nome) + '</span></div>';
    }).join('');
  }
  function renderRanking(){
    var D = lastData || {};
    $('tvRange').textContent = fmtDate(D.periodoInicio) + '  →  ' + fmtDate(D.periodoFim);
    $('tvUpdated').textContent = 'Atualizado em ' + fmtUpdated(D.atualizadoEm);
    renderBoard($('gCor'), D.corretores, { cols: function(n){ return n > 36 ? 4 : n > 12 ? 3 : 1; }, maxH: 66, fallbackH: 640 });
    renderBoard($('gSup'), D.supervisores, { cols: function(){ return 1; }, maxH: 78, fallbackH: 640 });
  }

  // ---------- barra de progresso ----------
  function tick(){
    var p = progDur ? Math.min(1, (performance.now() - progT0) / progDur) : 0;
    $('progress').style.transform = 'scaleX(' + p + ')';
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- ciclo ----------
  function activate(name){
    Object.keys(slides).forEach(function(k){ if (slides[k]) slides[k].classList.toggle('active', k === name); });
  }
  function next(){
    clearTimeout(timer);
    idx = (idx + 1) % SEQUENCIA.length;
    var name = SEQUENCIA[idx];
    Object.keys(videos).forEach(function(k){ if (k !== name) videos[k].pause(); });
    if (name === 'ranking') return showRanking();
    if (name === 'animado') return showAnimado();
    return showVideo(name);
  }
  function showRanking(){
    progDur = 0;
    loadData().then(function(){
      activate('ranking');
      renderRanking();
      progT0 = performance.now(); progDur = RANKING_SECONDS * 1000;
      timer = setTimeout(next, RANKING_SECONDS * 1000);
    });
  }
  function showAnimado(){
    if (!frame) return next();
    frame.src = ANIMADO_URL + '?tv=1&t=' + Date.now();
    activate('animado');
    timer = setTimeout(next, ANIMADO_MAX_SECONDS * 1000);
  }
  function showVideo(name){
    var video = videos[name];
    activate(name);
    try { video.currentTime = 0; } catch(e){}
    video.muted = !soundOn;
    var pp = video.play(); if (pp && pp.catch) pp.catch(function(){});
    var ms = (isFinite(video.duration) && video.duration > 0 ? video.duration + 3 : 300) * 1000;
    timer = setTimeout(next, video.error ? ERROR_SKIP_SECONDS * 1000 : ms);
  }
  Object.keys(videos).forEach(function(k){
    videos[k].addEventListener('ended', function(){ if (SEQUENCIA[idx] === k) next(); });
    videos[k].addEventListener('error', function(){ if (SEQUENCIA[idx] === k){ clearTimeout(timer); timer = setTimeout(next, ERROR_SKIP_SECONDS*1000); } });
  });

  // o ranking animado avisa quando termina e quando está pronto
  addEventListener('message', function(e){
    if (!frame || e.source !== frame.contentWindow || !e.data) return;
    if (e.data.type === 'animado-fim' && SEQUENCIA[idx] === 'animado') next();
    if (e.data.type === 'animado-pronto') sendSound();
  });
  function sendSound(){ if (!frame) return; try { frame.contentWindow.postMessage({ type: 'tv-som', on: soundOn }, '*'); } catch(e){} }

  soundBtn.addEventListener('click', function(e){
    e.stopPropagation();
    soundOn = !soundOn;
    soundBtn.textContent = soundOn ? '🔊' : '🔇';
    Object.keys(videos).forEach(function(k){ videos[k].muted = !soundOn; });
    sendSound();
  });

  next();
})();
</script>
</body>
</html>
